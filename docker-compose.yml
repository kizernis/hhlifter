services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tracker_db
    ports:
      - "5432:5432"
    volumes:
      # - postgres_data:/var/lib/postgresql/data
      - ./db_data:/var/lib/postgresql/data # Данные базы будут в папке db_data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"

  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - HH_LOGIN=${HH_LOGIN}
      - HH_PASSWORD=${HH_PASSWORD}
  worker:
    restart: always
    build: .
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - .:/app
      - ./browser_cache:/app/browser_cache
      - ./traces:/app/traces
      - ./logs:/app/logs
    depends_on:
      - redis
      - db
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      HH_LOGIN: ${HH_LOGIN}
      HH_PASSWORD: ${HH_PASSWORD}
  
  # Будильник для Celery
  beat:
    restart: always
    build: .
    command: celery -A worker.celery_app beat --loglevel=info
    volumes:
      - .:/app
      - ./logs:/app/logs
    depends_on:
      - redis
      - db
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      HH_LOGIN: ${HH_LOGIN}
      HH_PASSWORD: ${HH_PASSWORD}

